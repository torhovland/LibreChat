name: Sync upstream LibreChat main

on:
  schedule:
    # Daily at 04:00 UTC. The fork's main is the released upstream branch.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: librechat-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LibreChat-AI/LibreChat.git
          git fetch upstream main
          BEFORE="$(git rev-parse HEAD)"
          git merge --no-edit upstream/main
          AFTER="$(git rev-parse HEAD)"
          echo "sha=${AFTER}" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin main
            echo "Merged and pushed upstream changes."
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: read
      id-token: write
