name: Deploy latest LibreChat release

on:
  schedule:
    # Check once a day. A new upstream release is deployed within a day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (optional; defaults to the latest app release)
        required: false
        default: ''
        type: string
      force:
        description: Deploy even if this tag is already recorded as deployed
        required: false
        default: false
        type: boolean
      dry_run:
        description: Prepare the release branch but skip the build and deployment
        required: false
        default: false
        type: boolean

concurrency:
  group: librechat-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.prep.outputs.sha }}
      changed: ${{ steps.prep.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG#refs/tags/}"
          else
            TAG="$(gh api 'repos/LibreChat-AI/LibreChat/releases?per_page=30' \
              --jq '[.[] | select(.draft == false and (.tag_name | startswith("v")))] | sort_by(.published_at) | last | .tag_name')"
          fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "No LibreChat app release found" >&2
            exit 1
          fi
          case "${TAG}" in
            v*) ;;
            *) echo "Not an app release tag: ${TAG}" >&2; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare exact release tag
        id: prep
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          STATE="$(cat .github/deployed-release 2>/dev/null | tr -d '[:space:]' || true)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${STATE}" = "${TAG}" ] && [ "${FORCE}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} is already recorded as deployed."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git fetch --force https://github.com/LibreChat-AI/LibreChat.git \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          WORKTREE="${RUNNER_TEMP}/librechat-release-${TAG}"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "refs/tags/${TAG}"

          # The release tag contains the application code. Keep the deployment
          # files from main so the release branch builds exactly like the rest
          # of this fork.
          cp -a deploy "$WORKTREE/deploy"

          cd "$WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy
          if ! git diff --cached --quiet; then
            git commit -m "deploy: ${TAG}"
          fi
          SHA="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/release/${TAG}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Prepared release/${TAG} at ${SHA}"

  deploy:
    name: Deploy release
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && inputs.dry_run != true
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
      id-token: write

  record:
    name: Record deployed release
    needs: [prepare, deploy]
    if: needs.prepare.outputs.changed == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .github
          printf '%s\n' "${TAG}" > .github/deployed-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deployed-release
          if git diff --cached --quiet; then
            echo "State already records ${TAG}."
            exit 0
          fi
          git commit -m "chore: record deployed release ${TAG}"
          git push origin main
